<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>HBI Case Files</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213d; --paper:#f7efd8; --paper2:#efe3c2; --red:#c1272d; --gold:#e0a526;
  --green:#2e7d4f; --muted:#6b5e45;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;
  min-height:100vh;padding:16px 16px 40px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;color:var(--paper);margin-bottom:18px}
.badge{width:58px;height:58px;border-radius:50%;background:var(--gold);color:var(--ink);
  display:grid;place-items:center;font-family:"Special Elite",monospace;font-size:18px;font-weight:bold;
  border:3px dashed var(--ink);outline:3px solid var(--gold);flex:none}
header h1{font-family:"Special Elite",monospace;font-size:20px;margin:0;line-height:1.1}
header small{opacity:.75;font-size:13px}
.intro{color:var(--paper);font-size:17px;line-height:1.45;margin:0 0 16px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--paper);border-radius:14px;padding:18px;
  box-shadow:0 6px 0 var(--paper2),0 10px 24px rgba(0,0,0,.35);position:relative;overflow:hidden;margin-bottom:22px}
a.card:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(20,33,61,.05) 31px 32px);pointer-events:none}
a.card:active{transform:translateY(3px)}
.stamp{position:absolute;top:14px;right:-6px;transform:rotate(12deg);border:3px solid var(--red);color:var(--red);
  font-family:"Special Elite",monospace;padding:2px 10px;font-size:13px;opacity:.85;letter-spacing:1px}
.kicker{font-family:"Special Elite",monospace;color:var(--red);font-size:14px;letter-spacing:1px;text-transform:uppercase}
h2{font-family:"Special Elite",monospace;font-size:26px;margin:4px 0 10px;line-height:1.15}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:17px;line-height:1.35}
.facts b{white-space:nowrap}
.go{margin-top:14px;background:var(--red);color:#fff;font-weight:800;font-size:19px;text-align:center;border-radius:12px;padding:14px;box-shadow:0 4px 0 #7d1419}
footer{color:var(--paper);opacity:.6;text-align:center;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">HBI</div>
    <div>
      <h1>Harlem Bureau of Investigation</h1>
      <small>Official Case Files</small>
    </div>
  </header>
  <p class="intro">Agents, pick your case. Your field supervisor (a grown-up!) comes with you. Solve every clue, collect the evidence, and crack the secret password.</p>
  <div id="cases"></div>
  <footer>HBI · Harlem, New York</footer>
</div>
<script>
const CASES = [
  { num: "111", title: "The Missing Melody", file: "hbi-case-file-111.html",
    area: "East Harlem & the north end of Central Park",
    start: "The Locke School (111th St & Fifth Ave)",
    duration: "60–75 min · about 1 mile", clues: 7, when: "After school" },
  { num: "122", title: "The Silent Bell", file: "hbi-case-file-122.html",
    area: "Central Harlem · 125th Street & Marcus Garvey Park",
    start: "HBI HQ (W 122nd St & Morningside Ave)",
    duration: "60–90 min · about 1 mile", clues: 8, when: "Weekend (good for a rainy day)" }
];
document.getElementById("cases").innerHTML = CASES.map(c => `
  <a class="card" href="${c.file}">
    <div class="stamp">CASE #${c.num}</div>
    <div class="kicker">HBI · Case #${c.num}</div>
    <h2>${c.title}</h2>
    <div class="facts">
      <b>📍 Area</b><span>${c.area}</span>
      <b>🚩 Start</b><span>${c.start}</span>
      <b>⏱️ Time</b><span>${c.duration}</span>
      <b>🔍 Clues</b><span>${c.clues}</span>
      <b>📅 Best</b><span>${c.when}</span>
    </div>
    <div class="go">🔍 Open case file</div>
  </a>`).join("");
</script>
</body>
</html>
